<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dm.css">
    <link rel="icon" type="image/x-icon" href="img/logo.png">
    <title>Zina - Личные сообщения</title>
</head>

<body>
    <div class="header">

    </div>

    <audio src="beep.ogg" id="notify-audio"></audio>
    <div class="main-content">
        <div id="dm-full" hidden>
            <div class="dm-container">
                <div class="dm-row">
                    <button onclick="closedm()">Назад</button>
                    <button class="red-btn" onclick="deletedm()">Скрыть переписку</button>
                </div>
                <h3 id="dm-template">Человек</h3>
                <h1>Личные сообщения</h1>
                
                <div class="messages-container" id="messages-container">

                </div>
            </div>

            <div id="bottom-widjets">
                <!-- One might use this buttons, and one might see the foolery
                <button><img src="img/dms/paperclip.png" alt="Прикрепить"></button>
                <button><img src="img/dms/microphone.png" alt="Микрофон"></button> -->
                <input type="text" id="msg" placeholder="Введите своё сообщение здесь.">
                <button class="send-btn" onclick="send(inputbox.value)">Отправить</button>
            </div>
        </div>

        <div id="dm-list">
        </div>
    </div>


    <script src="scripts/footer.js"></script>
    <script src="scripts/header.js"></script>

    <script src="scripts/people.js"></script>
    <script src="scripts/dm.js"></script>
</body>

</html>
