<!DOCTYPE html>
<html lang="ru">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="style.css">
   <link rel="icon" type="image/x-icon" href="img/logo.png">
   <title>Zina — Аккаунт</title>
</head>
<body>
    <div class="header">
    </div>

    <div class="main-content">
        <div class="left-aligned">
            <div class="form">
                <h1 id="title">Регистрация</h1>
                <div id="signup-buttons">
                    <p>Уже есть аккаунт? Войдите с помощью одного из ниже предоставленных способов</p>
                    <button onclick="redirect('login.html?href=email')" class="white-btn" title="Войти с помощью почты"><img src="https://www.svgrepo.com/show/521128/email-1.svg" height="16" width="16"></button>
                    <button onclick="redirect('login.html?href=vk')" class="white-btn" title="Войти через ВКонтакте"><img src="img/logos/vk.svg" height="16" width="16"></button>
                    <button onclick="redirect('login.html?href=gosuslugi')" class="white-btn" title="Войти через Госуслуги"><img src="img/logos/gosuslugi.png" height="16" width="16"></button>
                    <button onclick="redirect('login.html?href=yandex')" class="white-btn" title="Войти через Яндекс"><img src="img/logos/yandex.png" height="16" width="16"></button>
                    <button onclick="redirect('login.html?href=ok')" class="white-btn" title="Войти через Одноклассники"><img src="img/logos/ok.png" height="16" width="16"></button>
                </div><br>
                <p>ФИО</p>
                <input id="name" type="text" placeholder="Кузнецов Иван Александрович"><br><br>

                <p>Ваш e-mail</p>
                <input id="email" type="email" placeholder="Ivan19@mail.ru"><br><br>

                <p>Пароль</p>
                <input id="password" type="password" placeholder=""><br><br>

                <p>Обо мне <a class="gray">(Необязательно)</a></p>
                <textarea id="about" placeholder="Я люблю читать книги 🤗"></textarea><br><br>

                <p>Дата рождения</p>
                <input id="age" type="date"><br><br>

                <p>Город</p>
                <input id="city" type="text" placeholder="Москва" required><br><br>

                <div id="gender-div">
                    <p>Пол</p>
                    <select id="gender" required>
                        <option value="Мужчина">Мужской</option>
                        <option value="Женщина">Женский</option>
                    </select>
                </div>

                <p>Фотография</p>
                <input id="photo" type="file" accept="image/png, image/jpeg" multiple><br><br>

                <img src="img/captcha.gif"><br>
                <input id="captcha" type="text" placeholder="Впишите число цифрами"><br><br>

                <div id="eula">
                    <input type="checkbox" id="eula-input"></input><label for="eula-input"> Я принимаю <a href="tos.html" class="black-href">пользовательское соглашение</a> и 
                        <a href="tos.html" class="black-href">политику конфиденциальности</a></label> 
                    <p id="eula-not-accepted" hidden class="red">Вы должны согласиться с пользовательским соглашением, чтобы продолжить</p>
                </div>
                <br>

                <button onclick="submit()" type="submit" id="signup">Зарегистрироваться</button>
                <button class="red-btn" onclick="deleteAccount()" id="delete-account" hidden>Удалить аккаунт</button>
            </div>
        </div>
    </div>

    <script src="scripts/footer.js"></script>

    <script src="scripts/reg.js"></script>
    <script src="scripts/header.js"></script>
</body>
</html>
