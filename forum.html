<!DOCTYPE html>
<html lang="ru">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <link rel="stylesheet" href="style.css">
   <link rel="icon" type="image/x-icon" href="img/logo.png">
   <title>Zina — Форум</title>
</head>
<body>
    <div class="header">

    </div>

    <div class="main-content">
        <div class="container">
            <div class="form">
                <strong>Здесь вы можете написать сценарий для поддельной переписки (сообщения разделяйте переносом строки)</strong><br><br>
                <p>ID собеседника</p>
                <input id="id" type="text" placeholder="0">
                <p>Сценарий переписки</p>
                <textarea id="scenario" placeholder="Напишите здесь сценарий. Например:
Привет, ты мне понравился.
А ты любишь читать книги?"></textarea><br>
                <input type="checkbox" id="is-first" title="Собеседник напишет вам первым.">Первое сообщение</input><br>
                <button onclick="save()">Сохранить</button>
                <button onclick="load()">Загрузить сценарий</button>
                <button class="red-btn" onclick="reset()">Обратить вспять сценарий</button>
            </div>
        </div>
    </div>
    
    <script src="scripts/footer.js"></script>

    <script src="scripts/forum.js"></script>
    <script src="scripts/header.js"></script>
</body>
</html>
